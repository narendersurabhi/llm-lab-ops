name: lab-ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e "policy-llm-lab[dev]"
      - name: Lint
        run: |
          cd policy-llm-lab
          python -m ruff check .
      - name: Typecheck
        run: |
          cd policy-llm-lab
          python -m mypy llm_lab
      - name: Tests
        run: |
          cd policy-llm-lab
          python -m pytest -m "unit or component or contract"
