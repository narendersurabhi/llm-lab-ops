[project]
name = "policy-llm-lab"
version = "0.1.0"
description = "LLM lab pipeline: ingest, index, eval, release"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
  "fastapi>=0.109",
  "uvicorn>=0.23",
  "pydantic>=2.5",
  "jsonschema>=4.20",
  "pypdf>=4.0",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "httpx>=0.26",
  "ruff>=0.1",
  "mypy>=1.7",
]
train = [
  "transformers>=4.40",
  "datasets>=2.18",
  "accelerate>=0.29",
  "peft>=0.10",
  "trl>=0.9",
  "mlx-lm>=0.10; platform_system == \"Darwin\"",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["llm_lab"]
exclude = ["tests*", "data*", "artifacts*", "dist*", "release*"]

[tool.pytest.ini_options]
addopts = "-q"
markers = [
  "unit: fast, deterministic unit tests",
  "component: component-level tests (SQLite/index/retrieval)",
  "contract: release bundle contract tests",
]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
