name: ops-ci

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * *"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e "policy-llm-ops[dev]"
          pip install -e "policy-llm-lab[dev]"
      - name: Lint
        run: |
          cd policy-llm-ops
          python -m ruff check .
      - name: Typecheck
        run: |
          cd policy-llm-ops
          python -m mypy llm_ops
      - name: Tests
        run: |
          cd policy-llm-ops
          python -m pytest -m "unit or contract"

  integration:
    if: github.ref == 'refs/heads/main' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e "policy-llm-lab[dev]"
          pip install -e "policy-llm-ops[dev]"
      - name: Integration tests
        run: |
          cd policy-llm-ops
          make test-integration
