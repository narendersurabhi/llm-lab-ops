[project]
name = "policy-llm-ops"
version = "0.1.0"
description = "LLM ops gateway and agent runtime"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
  "fastapi>=0.109",
  "uvicorn>=0.23",
  "pydantic>=2.5",
  "httpx>=0.26",
  "langgraph>=0.0.40",
  "prometheus_client>=0.18",
  "opentelemetry-api>=1.21",
  "opentelemetry-sdk>=1.21",
  "opentelemetry-exporter-otlp>=1.21",
  "opentelemetry-instrumentation-fastapi>=0.44b0",
  "opentelemetry-instrumentation-httpx>=0.44b0",
  "jsonschema>=4.20",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "pytest-asyncio>=0.23",
  "httpx>=0.26",
  "ruff>=0.1",
  "mypy>=1.7",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["llm_ops"]
exclude = ["tests*"]

[tool.pytest.ini_options]
addopts = "-q"
markers = [
  "unit: fast, deterministic unit tests",
  "integration: docker compose integration tests",
  "e2e: end-to-end rollout/rollback tests",
  "contract: cross-repo contract tests",
]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
